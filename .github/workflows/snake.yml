name: Generate Snake Animation

on:
  # Her 12 saatte bir otomatik çalışır
  schedule:
    - cron: "0 */12 * * *"
  # Manuel tetikleme (Actions sekmesinden "Run workflow")
  workflow_dispatch:
  # main'e her push'ta çalışır
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#161B22,#1F6FEB,#22D3EE,#8B5CF6,#A371F7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
